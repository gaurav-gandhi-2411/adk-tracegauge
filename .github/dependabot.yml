version: 2
updates:
  # Python — repo root (uv.lock present)
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    assignees:
      - gaurav-gandhi-2411
    labels:
      - dependencies
    ignore:
      # litellm is only here transitively (adk-tracegauge[eval] -> google-adk[eval] ->
      # google-cloud-aiplatform[evaluation]) and adk-tracegauge never imports it. That extra caps
      # litellm below 1.86.0 on Python < 3.14, so the patched release for GHSA-3cv6-jpf6-8222
      # (1.88.6) can never resolve here and every litellm update run fails. Not fixable in this
      # repo; tracked upstream at googleapis/python-aiplatform#UPSTREAM_ISSUE_NUMBER and watched
      # weekly by oss-contrib's weekly_check.py. Remove this entry once that cap is lifted.
      - dependency-name: "litellm"

  # GitHub Actions — keep action versions current.
  # daily, not weekly: a newly-merged workflow job can introduce pins that are
  # already stale relative to what dependabot bumped everywhere else in the same
  # file days earlier (real incident on the sibling agentgauge repo: a new CI job
  # shipped actions/checkout@v4 + setup-python@v5 while the rest of ci.yml was
  # already on @v7 -- not a scoping bug, this entry already covers the whole
  # file; the job was just merged after that cycle's scan). Daily shrinks that
  # drift window from ~a week to ~a day without meaningfully raising PR volume.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    assignees:
      - gaurav-gandhi-2411
    labels:
      - dependencies
