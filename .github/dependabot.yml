version: 2
updates:
  # Python — repo root (uv.lock present)
  #
  # litellm: deliberately NO `ignore`. litellm is transitive (adk-tracegauge[eval] -> google-adk[eval]
  # -> google-cloud-aiplatform[evaluation], which caps it <1.86.0 on Python <3.14), so Dependabot's
  # security update for GHSA-3cv6-jpf6-8222 (patched 1.88.6) cannot resolve and its job fails (three
  # runs on 2026-10-05). GitHub's docs say `ignore` also applies to security-update pull requests, so an
  # ignore would silence the one automatic signal that the patch became installable. The failing job is
  # not a required check; leave it red. Upstream: googleapis/python-aiplatform#7201, tracked by the
  # owner's weekly check, which also watches the cap itself. Remove this note when the cap lifts.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    assignees:
      - gaurav-gandhi-2411
    labels:
      - dependencies

  # GitHub Actions — keep action versions current.
  # daily, not weekly: a newly-merged workflow job can introduce pins that are
  # already stale relative to what dependabot bumped everywhere else in the same
  # file days earlier (real incident on the sibling agentgauge repo: a new CI job
  # shipped actions/checkout@v4 + setup-python@v5 while the rest of ci.yml was
  # already on @v7 -- not a scoping bug, this entry already covers the whole
  # file; the job was just merged after that cycle's scan). Daily shrinks that
  # drift window from ~a week to ~a day without meaningfully raising PR volume.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    assignees:
      - gaurav-gandhi-2411
    labels:
      - dependencies
