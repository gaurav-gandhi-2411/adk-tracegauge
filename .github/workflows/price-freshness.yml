name: Price table freshness

# Fails on either of two independent conditions (Phase 3 B2 2.4 added the
# second): any price table entry's fetched_on date exceeds
# adk_tracegauge._pricing.STALE_THRESHOLD_DAYS (90 days), OR any entry's
# promo_until date is within adk_tracegauge._pricing.PROMO_EXPIRY_WARNING_DAYS
# (14 days) of today or already past. Pure date arithmetic against the
# bundled JSON file -- no network calls, no paid API calls, zero cost. A red
# run here means an entry needs re-verifying against its own source_url (see
# the script's output for which one), not that anything in this repo is
# broken.
#
# Weekly cadence, not daily: the threshold is measured in months (90 days),
# so a week's detection lag is negligible against that window, and running
# daily would just add 7x the CI noise for zero earlier warning in
# practice. Same weekday/cadence family as pypi-canary.yml, offset by an
# hour so the two scheduled jobs don't contend for the same runner slot.
#
# GG1 (Phase 8): a second, independent step below fetches each vendor's own
# published pricing page (Anthropic, Google, OpenAI) and compares it
# directly against every entry this repo's table claims -- replaces the
# FF4.3 cross-repo-comparison plan (never implemented), which would have
# compared this table against a SIBLING repo's table instead of against the
# vendor. Two tables compared only to each other stay green even while both
# drift into staleness together -- the actual failure this repo hit once
# already (see docs/audit/PHASE8_PLAN.md FF2.2). A vendor page fetch
# failure or structural change fails this step loudly, distinctly from a
# genuine price mismatch -- see scripts/check_price_table_vs_vendor.py's
# own module docstring.
#
# AN3: a third, independent step checks for full-removal retirements (a
# model completely absent from Gemini's free models.list() endpoint --
# distinct from price DRIFT, which the two steps above already cover; this
# catches a model that's gone entirely, like gemini-2.0-flash was before
# this fix). Requires a GOOGLE_API_KEY repo secret to actually run; SKIPS
# gracefully (exit 0) if that secret isn't configured, so this step is
# inert-by-default and does NOT require anyone to add a key -- see
# scripts/check_model_retirement_gemini.py's own module docstring for why
# this specific retirement class is free-verifiable while the other class
# discovered this session (account-eligibility gating, e.g.
# gemini-2.5-flash-lite's "no longer available to new users" 404) is not,
# and is handled by a documented field + manual review instead.

on:
  schedule:
    - cron: "0 7 * * 1" # every Monday 07:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "refresh-fetched-on: only report what would change; open no branch or PR"
        type: boolean
        default: true

# No default token scope; each job states what it needs (the audit job only reads).
permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  price-freshness:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        # scripts/check_price_freshness.py imports adk_tracegauge._pricing,
        # and importing any adk_tracegauge submodule runs the package's own
        # __init__.py first (registers the eval metric against google-adk),
        # so the full [eval] dependency tree is required here too, same as
        # ci.yml -- there is no lighter-weight import path around that.
        run: uv sync --frozen

      - name: Check price table freshness
        run: uv run python scripts/check_price_freshness.py

      - name: Check price table against each vendor's own published page
        run: uv run python scripts/check_price_table_vs_vendor.py

      - name: Check for fully-retired Gemini models (free, skips without a key)
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: uv run python scripts/check_model_retirement_gemini.py

  # Added 2026-11-03. release.yml's preflight-prices (and the test suite) fail once any entry's
  # fetched_on is more than 30 days old, even when no price changed; every entry had been fetched
  # 2026-10-30, so both would have gone red on 2026-11-30. This job re-runs the full live vendor
  # audit and opens a PR that moves fetched_on to today for every entry that re-verified, and the
  # page hashes when the whole audit is clean (scripts/refresh_price_fetched_on.py). It NEVER
  # changes a rate: a MISMATCH or UNVERIFIED row keeps its date and is listed in the PR body. It
  # never merges: the PR goes through merge_gate.py. Independent of the job above, so a red audit
  # still refreshes the entries that did verify.
  #
  # Same owner step as tested-range-bump.yml: CI does not start on a PR opened by the Actions bot,
  # so close and reopen it as a maintainer. One PR per day (branch chore/price-fetched-on-<date>).
  refresh-fetched-on:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the refresh branch
      pull-requests: write # open the PR
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          # kept (the default): the "Open the PR" step pushes the branch with this token
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Re-verify every entry and refresh fetched_on
        id: refresh
        run: |
          uv run python scripts/refresh_price_fetched_on.py --write \
            --body-file "$RUNNER_TEMP/pr_body.md"

      - name: Show the diff
        if: steps.refresh.outputs.changed == 'true'
        run: git --no-pager diff --stat && git --no-pager diff && cat "$RUNNER_TEMP/pr_body.md"

      - name: Open the PR
        if: steps.refresh.outputs.changed == 'true' && env.DRY_RUN != 'true'
        env:
          REFRESHED: ${{ steps.refresh.outputs.refreshed }}
        run: |
          set -euo pipefail
          branch="chore/price-fetched-on-$(date -u +%Y-%m-%d)"
          if [ -n "$(gh pr list --repo "$REPO" --head "$branch" --state all --json number --jq '.[].number')" ]; then
            echo "a PR for $branch already exists; nothing to do"; exit 0
          fi
          title="chore(pricing): re-verified fetched_on for ${REFRESHED} entries ($(date -u +%Y-%m-%d))"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add src/adk_tracegauge/data/gemini_prices.json
          git commit -m "$title"
          git push origin "$branch"
          gh pr create --repo "$REPO" --base main --head "$branch" --title "$title" \
            --body-file "$RUNNER_TEMP/pr_body.md"
