name: PyPI canary (latest google-adk)

# adk-tracegauge pins google-adk[eval]>=2.6.0,<2.10.0 because it registers
# against google-adk's @experimental MetricEvaluatorRegistry API, which
# carries no SemVer guarantee. This workflow deliberately installs the
# *latest* google-adk[eval] release, ignoring that pin, so a breaking
# change surfaces here on a weekly schedule instead of via a user's own
# import failing with no warning. A red run here does not mean this repo
# is broken -- it means the current pin needs re-validating (and likely
# bumping) against a new google-adk release.
#
# Known structural limit: this runs THIS checkout's tests against the PUBLISHED wheel, so it
# is red whenever main has a tested feature that has not been released yet (a wheel/tests
# version skew, not a google-adk break). It was red on every scheduled run from 2026-08-17
# through 2026-09-14 for that reason plus the `scripts` import below -- read the failure
# before treating red as "google-adk broke us".

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the version PyPI currently serves as latest
        # The tests must be the ones that shipped WITH the published wheel. Running main's tests
        # against an older wheel made this canary red whenever main had a tested-but-unreleased
        # feature (it was red on every scheduled run 2026-08-17 .. 2026-09-14 for that reason plus
        # a pythonpath bug), so red stopped meaning "google-adk broke us" and nobody read it.
        # Red must mean exactly one thing. Also see release.yml: a red canary run now blocks releases.
        id: pv
        run: |
          v=$(curl -fsS https://pypi.org/pypi/adk-tracegauge/json | python3 -c "import sys,json; print(json.load(sys.stdin)['info']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "published adk-tracegauge: $v"

      - uses: actions/checkout@v7
        with:
          ref: v${{ steps.pv.outputs.version }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the real published adk-tracegauge from PyPI, then latest google-adk[eval]
        # This is a *canary* -- it must install what a real user actually gets
        # (the published PyPI wheel), not this checkout's local source via
        # `-e .`. `--upgrade` after the plain install lets google-adk[eval]'s
        # own extras resolve to the latest release, ignoring this repo's
        # <2.10.0 pin, so a breaking change surfaces here instead of via a
        # user's own import failing with no warning.
        run: |
          uv pip install --system adk-tracegauge
          uv pip install --system --upgrade "google-adk[eval]"
          uv pip install --system "pytest>=8.3,<9" "pytest-asyncio>=0.25,<1" pytest-mock

      - name: Report the installed adk-tracegauge version
        run: python -c "import importlib.metadata as m; print('adk-tracegauge', m.version('adk-tracegauge'))"

      - name: Report the installed google-adk version
        run: python -c "import importlib.metadata as m; print('google-adk', m.version('google-adk'))"

      - name: Run the test suite against latest google-adk
        # This repo's own pyproject.toml sets `pythonpath = [".", "src", "scripts"]`
        # so local dev/CI runs work without an install step -- but that same
        # setting would shadow the real PyPI install just performed above with
        # this checkout's local src/, defeating the entire point of a canary.
        # Override to drop "src" only, so `import adk_tracegauge` in the test
        # suite resolves to the real published wheel on sys.path via
        # site-packages, not this checkout. "." must stay: it is the repo root,
        # which has no adk_tracegauge package of its own (src layout, so no
        # shadowing) but is what makes `import scripts.<...>` resolve --
        # tests/test_check_price_table_vs_vendor.py failed collection with
        # "No module named 'scripts'" on every canary run once "." was dropped.
        # "scripts" itself is still needed for the helper modules
        # test_regression_confidence_grid.py / test_regression_power.py import.
        run: pytest tests/ -v --override-ini="pythonpath=. scripts"
