name: PyPI canary (latest google-adk)

# adk-tracegauge pins google-adk[eval]>=2.6.0,<2.7.0 because it registers
# against google-adk's @experimental MetricEvaluatorRegistry API, which
# carries no SemVer guarantee. This workflow deliberately installs the
# *latest* google-adk[eval] release, ignoring that pin, so a breaking
# change surfaces here on a weekly schedule instead of via a user's own
# import failing with no warning. A red run here does not mean this repo
# is broken -- it means the current pin needs re-validating (and likely
# bumping) against a new google-adk release.

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the real published adk-tracegauge from PyPI, then latest google-adk[eval]
        # This is a *canary* -- it must install what a real user actually gets
        # (the published PyPI wheel), not this checkout's local source via
        # `-e .`. `--upgrade` after the plain install lets google-adk[eval]'s
        # own extras resolve to the latest release, ignoring this repo's
        # <2.8.0 pin, so a breaking change surfaces here instead of via a
        # user's own import failing with no warning.
        run: |
          uv pip install --system adk-tracegauge
          uv pip install --system --upgrade "google-adk[eval]"
          uv pip install --system "pytest>=8.3,<9" "pytest-asyncio>=0.25,<1" pytest-mock

      - name: Report the installed adk-tracegauge version
        run: python -c "import importlib.metadata as m; print('adk-tracegauge', m.version('adk-tracegauge'))"

      - name: Report the installed google-adk version
        run: python -c "import importlib.metadata as m; print('google-adk', m.version('google-adk'))"

      - name: Run the test suite against latest google-adk
        # This repo's own pyproject.toml sets `pythonpath = [".", "src", "scripts"]`
        # so local dev/CI runs work without an install step -- but that same
        # setting would shadow the real PyPI install just performed above with
        # this checkout's local src/, defeating the entire point of a canary.
        # Override to drop "." and "src" (only "scripts" is still needed --
        # test_regression_confidence_grid.py / test_regression_power.py import
        # helper modules from there directly), so `import adk_tracegauge` in
        # the test suite resolves to the real published wheel on sys.path via
        # site-packages, not this checkout.
        run: pytest tests/ -v --override-ini="pythonpath=scripts"
