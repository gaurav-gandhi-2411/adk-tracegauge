[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adk-tracegauge"
dynamic = ["version"]
# PyPI shows this as the page subtitle and in search results, so it says what a searcher wants
# ("what does my Google ADK agent cost") and the honesty rule, not what the package is NOT. The
# caveats it used to lead with (not a drop-in adk eval metric; raw dollars, no calibrated bands)
# live in the README's "Also: a real PASS/FAIL cost metric inside adk eval" section.
description = "See what your Google ADK agent costs: per-invocation token cost in USD, plus a CI cost-regression gate. A model it cannot price is reported as unknown, never guessed."
authors = [{ name = "Gaurav Gandhi", email = "gaurav.gandhi2411@gmail.com" }]
requires-python = ">=3.10"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Natural Language :: English",
    "Operating System :: OS Independent",
]
# Terms someone would actually type to find this: the framework (adk / google-adk), the thing
# measured (llm cost, token usage/cost), the verb (tracking, monitoring), the models it prices
# (gemini, litellm-routed Claude/GPT), and the CI use (regression testing, evals).
keywords = [
    "adk",
    "google-adk",
    "agent-development-kit",
    "llm-cost",
    "token-cost",
    "token-usage",
    "cost-tracking",
    "cost-monitoring",
    "gemini",
    "litellm",
    "evaluation",
    "evals",
    "regression-testing",
    "llmops",
    "finops",
    "token-efficiency",
]
dependencies = [
    # [eval] is required, not optional: google-adk's own
    # metric_evaluator_registry.py unconditionally imports every built-in
    # evaluator at module import time, including the Vertex AI eval facade,
    # which transitively needs pandas/jinja2/rouge-score/tabulate/gepa --
    # gated behind this extra. Without it, `import adk_tracegauge` fails
    # with ModuleNotFoundError: No module named 'pandas', even though this
    # package uses none of those libraries itself. Confirmed by reading
    # google-adk's own pyproject.toml requires list.
    # <2.10.0: the full 470-test suite passes clean on every release in [2.7.1, 2.9.2]
    # (2.7.1, 2.8.0, 2.9.0, 2.9.1, 2.9.2 -- each in its own venv, 2026-09-20; 2.9.2 is
    # the newest on PyPI as of that date), no code changes required. Capped at the next
    # minor after the newest verified release rather than left open, because the
    # MetricEvaluatorRegistry this package registers into is @experimental (no SemVer
    # guarantee) -- widen again only after re-running the suite against the new release.
    "google-adk[eval]>=2.6.0,<2.10.0",
    # tracegauge dependency removed, Phase 4 R5: the only things this package
    # ever used from it (tes.cost.compute_session_cost/compute_turn_cost's
    # arithmetic, plus the tes._digest.SessionDigest/TurnDigest dataclasses
    # it operated on -- confirmed by grep, nothing else) are now ported
    # in-house at src/adk_tracegauge/_cost.py. See that module's docstring
    # for the full audit/rationale.
]

[dependency-groups]
dev = [
    "ruff>=0.15,<1",
    "mypy>=1.14,<3",
    # >=9.0.3: GHSA (pytest vulnerable tmpdir handling), fixed in 9.0.3.
    "pytest>=9.0.3,<10",
    # >=1: pytest-asyncio<1 caps pytest<9 transitively -- bumped alongside the pytest fix.
    "pytest-asyncio>=1,<2",
    "pytest-cov>=6.0,<8",
    "pytest-mock>=3.14,<4",
]

[project.urls]
Homepage = "https://github.com/gaurav-gandhi-2411/adk-tracegauge"
Documentation = "https://github.com/gaurav-gandhi-2411/adk-tracegauge#readme"
Changelog = "https://github.com/gaurav-gandhi-2411/adk-tracegauge/blob/main/CHANGELOG.md"
Issues = "https://github.com/gaurav-gandhi-2411/adk-tracegauge/issues"
Repository = "https://github.com/gaurav-gandhi-2411/adk-tracegauge"

[project.scripts]
adk-tracegauge = "adk_tracegauge._cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["adk_tracegauge*"]

[tool.setuptools.dynamic]
# Single source of truth for the package version: src/adk_tracegauge/__init__.py's
# __version__ literal. setuptools reads it via static AST analysis (no import needed,
# so no side effects from that module's heavy google-adk imports run at build time --
# verified working with this repo's setuptools>=70 in the guard test / build check below).
# This replaces the old two-hand-maintained-locations scheme (pyproject.toml's static
# `version = "..."` plus __init__.py's `__version__ = "..."`) that caused a real bug:
# PR #6 bumped only pyproject.toml's 0.2.0 -> 0.3.0, leaving __init__.py stale at 0.2.0.
version = { attr = "adk_tracegauge.__version__" }

[tool.setuptools.package-data]
"adk_tracegauge" = ["data/gemini_prices.json"]

[tool.ruff]
line-length = 100
# Matches requires-python's real floor (>=3.10), not a rounded-up convenience value --
# a higher target-version here would let ruff's pyupgrade rules (UP*) suggest 3.11+-only
# syntax (e.g. datetime.UTC) that breaks on the 3.10 floor this package claims to support.
# Found while verifying the CI 3.10-3.13 matrix (W6): ruff previously flagged exactly this
# on snapshot.py -- see PLAN.md's W6 entry for the full trace.
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v"
pythonpath = [".", "src", "scripts"]

[tool.coverage.run]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 0
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
